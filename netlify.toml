[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.3.0"
  NPM_VERSION = "10.0.0"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://*.clerk.accounts.dev https://*.clerk.com; object-src 'none'; base-uri 'self';"

# CORS headers for API endpoints (to allow WiseOS devices to connect)
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Enable Node.js 20 and esbuild bundler
[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/**"]

# Redirect portal.getwisephone.com to portal.wisephone.com
# This ensures Clerk authentication works correctly with production keys
[[redirects]]
  from = "https://portal.getwisephone.com/*"
  to = "https://portal.wisephone.com/:splat"
  status = 301
  force = true
